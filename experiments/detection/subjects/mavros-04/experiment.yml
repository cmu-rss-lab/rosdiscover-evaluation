type: detection
subject: mavros
distro: indigo
build_command: catkin build -DCMAKE_EXPORT_COMPILE_COMMANDS=1
missing_ros_packages: [uuid_msgs, geographic_msgs, tf, tf2_ros, diagnostic_updater, eigen_conversions, tf2_eigen, urdf, telemanip_msgs]
exclude_ros_packages: [lms1xx, orocos_kdl, python_orocos_kdl, opencv3]
apt_packages:
- ros-indigo-orocos-kdl
- libyaml-cpp-dev
buggy:
  docker:
    type: templated
    image: rosdiscover-experiments/mavros:mavros-04-buggy
  repositories:
  - name: mavros
    url: https://github.com/mavlink/mavros.git
    version: 70e2448549f826b49586df8faaf15af9fbb82461
fixed:
  docker:
    type: templated
    image: rosdiscover-experiments/mavros:mavros-04-fixed
  repositories:
  - name: mavros
    url: https://github.com/mavlink/mavros.git
    version: 7ed9e41d3d2c82d70161e75862c610254dd9ea35
sources:
- /opt/ros/indigo/setup.bash
- /ros_ws/devel/setup.bash
launches:
- /ros_ws/src/mavros/mavros/launch/px4.launch